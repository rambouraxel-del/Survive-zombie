# Déploiement sur GitHub Pages (workflow officiel recommandé par Vite / GitHub).
# Prérequis (une fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Contrôle du build (HTML compilé, pas le HTML de développement)
        run: |
          grep -q '/src/main.ts' dist/index.html && { echo "dist/index.html contient encore /src/main.ts"; exit 1; } || true
          grep -Eq 'src="\./assets/index-[^"]+\.js"' dist/index.html
          grep -Eq 'href="\./assets/index-[^"]+\.css"' dist/index.html
          test -f dist/assets/atlas/world.png && test -f dist/assets/chars/player.png && test -f dist/assets/chars/equip.png
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Vérifie le site réellement publié (URL publique) depuis un navigateur.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vérifier l’URL publique (dont la version servie = ce commit)
        run: node tests/e2e/check-deployed.mjs "${{ needs.deploy.outputs.page_url }}"
        env:
          EXPECTED_SHA: ${{ github.sha }}
      - name: Captures d’écran du site publié
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-site-publie
          path: test-results/deployed
