<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16120e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Les Bois de Cendre — RPG d’exploration solo : un camp, des expéditions, sept armes à maîtriser. Jouable au téléphone." />
    <title>Les Bois de Cendre</title>
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body>
    <div id="game"></div>
    <div id="ui">
      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="status">
          <div class="bar" id="bar-hp"><span class="lbl">PV</span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
          <div class="bar" id="bar-stamina"><span class="lbl">Endu.</span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
          <div class="bar" id="bar-mana"><span class="lbl">Mana</span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
          <div class="bar" id="bar-hunger"><span class="lbl">Faim</span><div class="track"><div class="fill"></div></div><span class="val"></span></div>
          <div id="placebox"><span id="place-line"></span></div>
        </div>
        <div id="bossbar" class="hidden"><span id="boss-name"></span><div class="track"><div class="fill"></div></div></div>
        <button id="objective" aria-label="Objectif en cours : toucher pour les détails">
          <span class="obj-ico"></span><span id="obj-title"></span><span id="obj-progress"></span>
        </button>
        <button id="pin" class="hidden" aria-label="Recette suivie : toucher pour l’ouvrir">
          <span class="pin-ico"></span><span id="pin-text"></span>
        </button>
        <div id="menu-buttons">
          <button class="mbtn" id="m-inv" aria-label="Sac"><span class="mico"></span><span class="mlbl">Sac</span><kbd>I</kbd></button>
          <button class="mbtn" id="m-menu" aria-label="Menu : fabriquer, construire, carte, options"><span class="mico"></span><span class="mlbl">Menu</span><kbd>Échap</kbd></button>
        </div>
        <div id="kbd-hints" aria-hidden="true"><span><kbd>ZQSD</kbd> marcher</span><span><kbd>Maj</kbd> courir</span><span><kbd>Espace</kbd> attaquer</span><span><kbd>E</kbd> action</span><span><kbd>K</kbd> esquive</span><span><kbd>U</kbd><kbd>I</kbd> compétences</span><span><kbd>L</kbd> ultime (maintenir, viser)</span><span><kbd>R</kbd> arme suivante</span><span><kbd>1-5</kbd> raccourcis</span><span><kbd>Tab</kbd> sac</span><span><kbd>N</kbd> journal</span><span><kbd>M</kbd> carte</span></div>
        <div id="debug" class="hidden"></div>
      </div>

      <!-- Commandes tactiles -->
      <div id="controls" class="hidden">
        <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div><div id="joy-hint">Glissez pour marcher<br />(à fond : courir)</div></div>
        <div id="quickbar"></div>
        <div id="action-buttons">
          <button id="btn-weapon" class="abtn tiny" aria-label="Changer d’arme"><span class="aico"></span><span class="wtier"></span></button>
          <button id="btn-skill-0" class="abtn skill" aria-label="Compétence 1"><span class="aico"></span><span class="cd"></span><span class="cost"></span><kbd>U</kbd></button>
          <button id="btn-skill-1" class="abtn skill" aria-label="Compétence 2"><span class="aico"></span><span class="cd"></span><span class="cost"></span><kbd>I</kbd></button>
          <button id="btn-ult" class="abtn ult" aria-label="Ultime : maintenir et glisser pour viser"><span class="ring"></span><span class="aico"></span><span class="pct"></span><kbd>L</kbd></button>
          <button id="btn-dodge" class="abtn small" aria-label="Esquiver"><span class="aico"></span><span class="albl">Esquive</span></button>
          <button id="btn-action" class="abtn" aria-label="Action"><span class="aico"></span><span class="albl">Action</span></button>
          <button id="btn-attack" class="abtn big" aria-label="Attaquer"><span class="aico"></span><span class="albl">Attaque</span><span class="reload hidden"><i></i></span></button>
        </div>
        <div id="ult-cancel" class="hidden">Relâcher ici pour annuler</div>
      </div>

      <!-- Mode construction -->
      <div id="placebar" class="hidden">
        <div id="place-info"><span id="place-name"></span><span id="place-reason"></span></div>
        <div id="place-buttons">
          <button id="place-rot" class="pbtn" title="Pas de rotation disponible pour ces éléments">Rotation</button>
          <button id="place-cancel" class="pbtn">Annuler</button>
          <button id="place-ok" class="pbtn ok">Valider</button>
        </div>
        <div id="place-help"></div>
      </div>

      <div id="toasts" aria-live="polite"></div>
      <div id="panel-layer" class="hidden"></div>
      <div id="screen-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Filet de sécurité : si le jeu ne démarre pas (ex. page non compilée publiée), on l'explique.
      (function () {
        var d = null;
        var t0 = Date.now();
        var iv = setInterval(function () {
          if (window.__app) {
            if (d) d.remove();
            clearInterval(iv);
            return;
          }
          if (!d && Date.now() - t0 > 20000) {
            d = document.createElement('div');
            d.setAttribute('style', 'position:fixed;inset:0;z-index:99;background:#16120e;color:#f2e8d5;font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px');
            d.textContent = 'Le jeu ne démarre pas. Connexion lente : patientez ou rechargez la page. Auteur du site : vérifiez que GitHub Pages publie la version compilée (Settings → Pages → Source : GitHub Actions).';
            document.body.appendChild(d);
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
